[package]
name         = "cantos"
version      = "0.0.2"
edition      = "2021"
rust-version = "1.77"
description  = "macOS-style hot corners for Windows"
authors      = ["kidchenko <kidchenko@gmail.com>"]
license      = "MIT"
repository   = "https://github.com/kidchenko/windows-cantos"

[[bin]]
name = "cantos"
path = "src/main.rs"

[dependencies]
muda = "0.19"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.37"
tray-icon = "0.24"
wry = "0.57"

[dependencies.windows]
version  = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winresource = "0.1"

# Size is a first-class goal: this profile is what keeps the shipped
# binary in the ~3-4 MB range rather than ~12 MB.
[profile.release]
opt-level     = "z"     # optimise for size over speed; nothing here is hot
lto           = true    # cross-crate dead-code elimination
codegen-units = 1       # better optimisation at the cost of build time
panic         = "abort" # drops the unwinding tables
strip         = true    # no symbols in the shipped binary
